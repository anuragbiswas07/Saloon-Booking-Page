<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You! | Style Zone Salon</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-image: url("https://img.magnific.com/free-photo/blur-gym-fitness_74190-4445.jpg?semt=ais_hybrid&w=740&q=80");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .thankyou-card {
      width: min(100%, 520px);
      padding: clamp(28px, 7vw, 48px);
      border: 1px solid #f0d7e1;
      border-radius: 12px;
      background-color: white;
      box-shadow: 0 16px 40px rgba(89, 28, 54, 0.1);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: #8e2c57;
      font-size: clamp(30px, 8vw, 40px);
    }

    p {
      margin: 0 0 24px;
    }

    .back-home {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 6px;
      background-color: #8e2c57;
      color: white;
      font-weight: bold;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .back-home:hover {
      background-color: #6d1f42;
    }

    .back-home:focus-visible {
      outline: 3px solid #c47b9a;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="thankyou-card">
    <h1>Thank You!</h1>
    <p>Your slot has been booked.</p>
    <a class="back-home" href="index.html">Back to Home</a>
  </main>
</body>
</html>
